# Values templated from configs/networks/${NETWORK}.env via scripts/compose.sh.
# BRIDGE_L1 / BRIDGE_L2: testnet 0xd7d4F6BF… (2026-06-27 re-genesis), mainnet
# 0xB6F28976… (2026-10-07 genesis) — same address on L1 and L2 on both networks.
# NOTE: mainnet has SETTLEMENT disabled for now (no batches verified on L1), so
# withdrawal claims are not yet possible there; deposits index normally.

[Log]
Level = "info"
Outputs = ["stdout"]

[NetworkConfig]
GenBlockNumber = ${L1_FIRST_BLOCK}
PolygonBridgeAddress = "${BRIDGE_L1}"
PolygonZkEVMGlobalExitRootAddress = "${GER_MANAGER}"
PolygonRollupManagerAddress = "${ROLLUP_CONTRACT}"
L2PolygonBridgeAddresses = ["${BRIDGE_L2}"]

[Etherman]
L1URL = "${L1_RPC_URL}"
L2URLs = ["${L2_RPC_URL}"]

[BridgeServer]
GRPCPort = "9090"
HTTPPort = "8080"

  [BridgeServer.DB]
  Database = "postgres"
  User = "bridge"
  Password = "${DB_PASS}"
  Host = "postgres"
  Port = "5432"
  Name = "bridge"
  MaxConns = 20

[ClaimTxManager]
Enabled = false
