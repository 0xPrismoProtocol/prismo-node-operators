apiVersion: v1
kind: Service
metadata:
  name: {{ include "prismo-rpc-node.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prismo-rpc-node.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "prismo-rpc-node.selectorLabels" . | nindent 4 }}
  ports:
    # cdk-erigon serves WS on a separate listener (ws.addr/ws.port), not
    # multiplexed on the HTTP port — expose both, plus metrics.
    - name: rpc
      port: {{ .Values.service.ports.rpc }}
      targetPort: rpc
    - name: ws
      port: {{ .Values.service.ports.ws }}
      targetPort: ws
    - name: metrics
      port: {{ .Values.service.ports.metrics }}
      targetPort: metrics
