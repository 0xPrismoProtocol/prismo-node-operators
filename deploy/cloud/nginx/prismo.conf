# Prismo RPC node — nginx reverse-proxy vhost.
#
# Install to /etc/nginx/conf.d/prismo.conf. This is the file documented in
# docs/04-security.md#reverse-proxy-nginx. The cloud-init templates install
# nginx + certbot but deliberately do NOT drop this vhost in automatically:
# `nginx -t` fails until the ssl_certificate files exist, so copy it in only
# AFTER certbot has issued the certs (see docs/04-security.md#tls-certificates-certbot):
#
#   sudo cp /opt/prismo-node-operators/deploy/cloud/nginx/prismo.conf /etc/nginx/conf.d/prismo.conf
#   # edit server_name + the two ssl_certificate paths to your hostname, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# limit_req_zone is only valid in the http{} context; nginx.conf already
# include's conf.d/*.conf from inside http{}, so this top-level directive lands
# in the right context without your own http{} wrapper.
limit_req_zone $binary_remote_addr zone=rpc:10m rate=20r/s;

server {
  listen 443 ssl;
  http2 on;
  server_name rpc.your-domain.example;

  ssl_certificate     /etc/letsencrypt/live/rpc.your-domain.example/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/rpc.your-domain.example/privkey.pem;

  limit_req zone=rpc burst=40 nodelay;

  location / {
    proxy_pass http://127.0.0.1:8545;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 1m;
    proxy_read_timeout 30s;
  }

  # WebSocket (cdk-erigon's :8546) — separate path since it's a different
  # upstream port than the HTTP RPC above.
  location /ws {
    proxy_pass http://127.0.0.1:8546;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;   # keep long-lived subscriptions open
  }
}
