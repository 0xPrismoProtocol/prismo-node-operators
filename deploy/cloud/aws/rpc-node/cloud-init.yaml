#cloud-config
package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - jq
  - curl
  - git
  - nginx
  - certbot
  - python3-certbot-nginx

write_files:
  - path: /etc/prismo/operator.env
    permissions: '0640'
    owner: root:root
    content: |
      NETWORK=${network}
      L1_RPC_URL=${l1_rpc_url}
      ${datastream_host_override == "" ? "" : "DATASTREAM_HOST=${datastream_host_override}"}

runcmd:
  # 1. Format + mount the data disk at /var/lib/prismo.
  #    Select by identity (the one whole disk that is NOT the root disk and has
  #    no filesystem), never by size — a sub-1TB data_disk_gb prints e.g. "500G"
  #    and the old `$2 ~ /T/` size match left DEV empty. Poll to absorb attach
  #    delay, then FAIL LOUDLY: cloud-init runcmd does NOT abort on a non-zero
  #    item, so step 4 also re-checks the mount before touching chaindata.
  - |
    set -u
    ROOT_DISK=$(lsblk -no PKNAME "$(findmnt -no SOURCE / 2>/dev/null)" 2>/dev/null | head -1 || true)
    DEV=""
    for i in $(seq 1 60); do
      for d in $(lsblk -dno NAME,TYPE | awk '$2=="disk"{print $1}'); do
        [ "$d" = "$ROOT_DISK" ] && continue
        [ -z "$(lsblk -no FSTYPE "/dev/$d" | tr -d '[:space:]')" ] && { DEV="$d"; break; }
      done
      [ -n "$DEV" ] && break
      sleep 2
    done
    if [ -z "$DEV" ]; then
      echo "prismo: no empty data disk found after 120s; refusing to place chaindata on the root disk" >&2
      exit 1
    fi
    mkfs.ext4 -F "/dev/$DEV"
    mkdir -p /var/lib/prismo
    echo "/dev/$DEV /var/lib/prismo ext4 defaults,nofail 0 2" >> /etc/fstab
    mount -a

  # 2. Pull operator repo.
  #    NOTE: this clones the mutable default branch, so a bad push to `main`
  #    changes what brand-new nodes deploy. Once a release tag is cut, pin it:
  #      - git clone --branch <release-tag> --depth 1 https://github.com/0xPrismoProtocol/prismo-node-operators /opt/prismo-node-operators
  - git clone https://github.com/0xPrismoProtocol/prismo-node-operators /opt/prismo-node-operators

  # 3. Build the role's .env from the canonical network env + operator overrides
  - |
    REPO=/opt/prismo-node-operators
    ROLE_DIR=$REPO/deploy/docker-compose/rpc-node
    cat $REPO/configs/networks/${network}.env $REPO/../etc/prismo/operator.env 2>/dev/null \
      || true
    cp /etc/prismo/operator.env $ROLE_DIR/.env

  # 4. Pre-create the named volume as a bind mount onto the data disk.
  #    Without this, `docker compose up` auto-creates `chaindata` as an
  #    anonymous local volume under /var/lib/docker on the ROOT disk, not the
  #    big EBS volume mounted at /var/lib/prismo in step 1 — chaindata would
  #    silently fill the small root disk instead. The name must match
  #    docker-compose.yml's `name:` + volume key exactly
  #    (prismo-rpc-<network>_chaindata) so compose adopts this volume instead
  #    of creating its own.
  - |
    mountpoint -q /var/lib/prismo || { echo "prismo: /var/lib/prismo is not a mounted data disk; aborting before creating chaindata on the root disk" >&2; exit 1; }
    mkdir -p /var/lib/prismo/chaindata
    docker volume create --driver local --opt type=none --opt o=bind \
      --opt device=/var/lib/prismo/chaindata prismo-rpc-${network}_chaindata

  # 5. Bring up the stack via the wrapper
  - cd /opt/prismo-node-operators && bash scripts/compose.sh rpc-node up -d

  # 6. Nginx + TLS — operator must run certbot post-boot once DNS is set:
  #    certbot --nginx -d rpc.your-domain.example
  - systemctl enable --now nginx
